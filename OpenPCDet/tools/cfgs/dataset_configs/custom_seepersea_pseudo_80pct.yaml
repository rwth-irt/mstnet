# Pseudo-label pretraining data for the 80% budget: the SIZE prior comes
# only from train_80pct.txt labels, so no held-out label leaks in.
# Pseudo-label pretraining data: boxes from DBSCAN centres + class-median size
# (77% centre recall, median BEV-IoU 0.34, 3.4 boxes/frame vs 1.1 real).
# gt_sampling is removed on purpose -- copy-pasting noisy pseudo-boxes would
# compound the label noise.
DATASET: 'CustomDataset'
DATA_PATH: '../data/custom_seepersea'

# Match MSTNet's SeePerSea range for a fair comparison
POINT_CLOUD_RANGE: [-100, -100, -20, 100, 148, 25]

MAP_CLASS_TO_KITTI: {
    'Ship': 'Car',
}

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [custom_infos_train_pseudo_80pct.pkl],
    'test': [custom_infos_val.pkl],
}

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': True
      }

    # PointPillars-style pillar voxelization (z spans the full range -> single z-bin).
    # Voxel-based models (SECOND/PV-RCNN/Voxel-RCNN) override VOXEL_SIZE in their configs.
    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.5, 0.5, 45]
      MAX_POINTS_PER_VOXEL: 128
      MAX_NUMBER_OF_VOXELS: {
        'train': 60000,
        'test': 60000
      }
