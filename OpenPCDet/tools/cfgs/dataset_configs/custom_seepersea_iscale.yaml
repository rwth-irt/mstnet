DATASET: 'CustomDataset'
DATA_PATH: '../data/custom_seepersea'

# Match MSTNet's SeePerSea range for a fair comparison
POINT_CLOUD_RANGE: [-100, -100, -20, 100, 148, 25]

MAP_CLASS_TO_KITTI: {
    'Ship': 'Car',
}

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [custom_infos_train.pkl],
    'test': [custom_infos_val.pkl],
}

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          USE_ROAD_PLANE: False
          DB_INFO_PATH:
              - custom_dbinfos_train.pkl
          PREPARE: {
             filter_by_min_points: ['Ship:5'],
          }
          SAMPLE_GROUPS: ['Ship:15']
          NUM_POINT_FEATURES: 4
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: True

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

DATA_PROCESSOR:
    # Undo the /255 normalisation the detection converter applies, so the encoder is
    # finetuned on the same intensity scale it was pretrained on. Diagnostic only.
    - NAME: scale_point_features
      # Keys are strings on purpose. easydict turns every mapping into attributes and
      # cannot set an integer attribute name, so an integer key aborts config loading
      # with "attribute name must be string, not 'int'". The reader casts back to int.
      SCALE_COLUMNS: {'3': 255.0}

    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    # Shuffling is on in BOTH phases on purpose, changed 2026-08-06 after an audit.
    # It interacts with MAX_POINTS_PER_VOXEL, which caps how many points of a cell the
    # encoder ever sees. With shuffling the retained points are a random subsample; the
    # cell mean is then a noisy but unbiased estimate of the true centroid. Without it
    # the retained points are the first ones in file order, which for an Ouster is beam
    # order from the top down, so the mean is pulled upward.
    # Measured on 150 SeePerSea validation frames, unshuffled minus true centroid:
    #   sparse-voxel configuration, cap 5    +0.176 m
    #   pillar configuration, cap 32         +1.174 m
    # Training already shuffled, so leaving test unshuffled meant the model was
    # evaluated on a systematically different feature than it was trained on, and the
    # difference lay on the height axis this work is about.
    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': True
      }

    # PointPillars-style pillar voxelization (z spans the full range -> single z-bin).
    # Voxel-based models (SECOND/PV-RCNN/Voxel-RCNN) override VOXEL_SIZE in their configs.
    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.5, 0.5, 45]
      MAX_POINTS_PER_VOXEL: 128
      MAX_NUMBER_OF_VOXELS: {
        'train': 60000,
        'test': 60000
      }
